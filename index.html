<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Workbase</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Zusätzliche professionelle Styles */
        .ph { padding: 20px 16px 12px; background: var(--bg); border-bottom: 1px solid var(--bdr); }
        .btn-green { background: #22c55e; color: white; }
        .price-box { background: #e0f2fe; padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; font-weight: 700; color: #0f766e; margin-top: 12px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="screens">
            <!-- Dashboard -->
            <div id="s-d" class="scr act">
                <div class="ph">
                    <h1 style="font-size:28px; margin-bottom:4px;">👋 Willkommen bei Workbase</h1>
                    <p style="color:#94a3b8;">Deine professionelle App für Maler & Handwerk</p>
                </div>
                <div style="padding:16px;">
                    <div class="card">
                        <h3>✅ App ist bereit!</h3>
                        <p>Alle Kernfunktionen sind jetzt integriert. Du kannst direkt loslegen.</p>
                    </div>

                    <button onclick="navTo('am')" class="btn btn-green" style="margin-top:20px;">🔪 Aufmass öffnen</button>
                    <button onclick="createSampleAngebot()" style="background:#38bdf8; color:white; margin-top:10px;">📄 Beispiel-Angebot als PDF erzeugen</button>
                </div>
            </div>

            <!-- Aufmass -->
            <div id="s-am" class="scr">
                <div class="ph"><h1>🔪 Aufmass Pro</h1></div>
                <div style="padding:16px;">
                    <div class="card">
                        <p>Dein volles Aufmass-Modul ist integriert (Räume, Formeln, VOB etc.).</p>
                        <button onclick="neuenRaum()" class="btn btn-green">+ Neuen Raum erfassen</button>
                    </div>
                    <div id="raumListe"></div>
                </div>
            </div>

            <!-- Weitere Screens können hier dynamisch hinzugefügt werden -->
        </div>

        <div class="nav" id="nav"></div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/aufmass.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Beispiel: Schnelles Angebot aus deinem Excel erzeugen
        function createSampleAngebot() {
            const sampleData = {
                nummer: "A-2026-042",
                kunde: "Fam. Heck",
                objekt: "Malerarbeiten Innenbereich",
                gesamtpreis: "3.650,00",
                gueltigBis: "in 30 Tagen",
                positionen: [
                    {
                        name: "Wohnzimmer",
                        preis: "650,00",
                        leistungen: [
                            "Abdecken und Schutz aller nicht zu bearbeitenden Flächen",
                            "Untergrundprüfung sowie kleinere Ausbesserungsarbeiten",
                            "Fachgerechtes Ausarbeiten von Kanten, Ecken und Anschlüssen",
                            "Zweifacher, deckender Anstrich mit hochwertiger Dispersionsfarbe"
                        ]
                    },
                    {
                        name: "Schlafzimmer Erdgeschoss",
                        preis: "950,00",
                        leistungen: [
                            "Abdecken und Schutz aller nicht zu bearbeitenden Flächen",
                            "Entfernen der vorhandenen Tapete (eine Wand)",
                            "Zweifaches Spachteln der Fläche",
                            "Tapezieren mit Malervlies"
                        ]
                    },
                    {
                        name: "Küche & Flur",
                        preis: "1.200,00",
                        leistungen: [
                            "Abdecken und Schutz aller nicht zu bearbeitenden Flächen",
                            "Zweifacher, deckender Anstrich mit hochwertiger Dispersionsfarbe"
                        ]
                    },
                    {
                        name: "Schlafzimmer Obergeschoss",
                        preis: "700,00",
                        leistungen: [
                            "Abdecken und Schutz aller nicht zu bearbeitenden Flächen",
                            "Zweifacher, deckender Anstrich mit hochwertiger Dispersionsfarbe"
                        ]
                    },
                    {
                        name: "Badezimmerdecke",
                        preis: "150,00",
                        leistungen: [
                            "Zweifacher, deckender Anstrich mit Feuchtraumfarbe"
                        ]
                    }
                ]
            };

            if (window.PDF) {
                PDF.createAngebot(sampleData);
            } else {
                alert('PDF-Modul nicht geladen. Bitte Seite neu laden.');
            }
        }

        // Globale Hilfsfunktion für Aufmass
        function neuenRaum() {
            if (window.neuenRaum) {
                window.neuenRaum();
            } else {
                alert('Aufmass-Modul wird geladen...');
            }
        }

        console.log('%c✅ Workbase App ist bereit!', 'color:#22c55e; font-weight:bold');
    </script>
</body>
</html>
